<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<title>Add leave</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f7f7f7;
    margin: 0;
    padding: 0;
  }

  #form3 {
    width: 60%;
    margin: 40px auto;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
  }

  h2 {
    text-align: center;
    color: #333;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }

  td input[type="text"], td input[type="date"] {
    padding: 8px;
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  input[type="submit"] {
    padding: 10px 20px;
    background-color: #2321ff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }

  input[type="submit"]:hover {
    background-color: #2321ff;
  }

  .submit-container {
    text-align: center;
    margin-top: 20px;
  }

  label {
    font-weight: bold;
  }
</style>

<script type="text/javascript">
  function validateForm() {
    var date = document.forms["form3"]["textfield"].value;
    var reason = document.forms["form3"]["textfield1"].value;

    if (date === "") {
      alert("Please select a date.");
      return false;
    }

    if (reason.trim() === "") {
      alert("Please enter a reason for leave.");
      return false;
    }

    return true;
  }
</script>
</head>

<body>
<form id="form3" name="form3" method="post" action="/addleavepost" onsubmit="return validateForm();">
  <h2>leave</h2>
  <table>
    <tr>
      <td><label for="disease-name">Date</label></td>
      <td><input type="date" name="textfield" id="disease-name" placeholder="" /></td>
    </tr>
    <tr>
      <td><label for="description">Reason</label></td>
      <td><input type="text" name="textfield1" id="description" placeholder="enter reason" /></td>
    </tr>

    <tr>
      <td colspan="2" class="submit-container">
        <input type="submit" name="Submit" value="Submit" id="Submit" />
      </td>
    </tr>
  </table>
</form>
</body>
</html>

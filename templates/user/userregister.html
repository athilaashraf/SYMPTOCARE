<!DOCTYPE html>
<html>
<head>
<title>User Registration</title>
<style>
body { font-family: Arial; background: #f4f4f4; padding: 20px; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
h2 { text-align: center; color: #2321ff; }
input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
button { width: 100%; background: #2321ff; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
button:hover { background: #1a18cc; }
.login-link { text-align: center; margin-top: 15px; }
.login-link a { color: #2321ff; text-decoration: none; }
label { font-weight: bold; display: block; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h2>User Registration</h2>
  <form method="post" action="/userregisterpost" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label>Full Name</label>
    <input type="text" name="name" required>
    
    <label>Age</label>
    <input type="number" name="age" min="1" max="120" required>
    
    <label>Gender</label>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
    
    <label>Phone</label>
    <input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10 digit number" required>
    
    <label>Email</label>
    <input type="email" name="email" required>
    
    <label>Place</label>
    <input type="text" name="place" required>
    
    <label>Post</label>
    <input type="text" name="post" required>
    
    <label>Pin Code</label>
    <input type="text" name="pin" pattern="[0-9]{6}" maxlength="6" required>
    
    <label>Photo</label>
    <input type="file" name="image" accept="image/*" required>
    
    <label>Username</label>
    <input type="text" name="username" required>
    
    <label>Password</label>
    <input type="password" name="password" minlength="6" required>
    
    <button type="submit">Register</button>
  </form>
  
  <div class="login-link">
    Already have an account? <a href="/">Login here</a>
  </div>
</div>
</body>
</html>

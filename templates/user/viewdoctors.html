<!DOCTYPE html>
<html>
<head>
<title>Doctors</title>
<style>
body { font-family: Arial; background: #f4f4f4; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; }
.nav { background: #2321ff; padding: 15px; margin: -20px -20px 20px -20px; }
.nav a { color: white; text-decoration: none; margin-right: 20px; }
.doctor-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; display: flex; gap: 20px; }
.doctor-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
.btn { background: #2321ff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="/userhome">Home</a>
    <a href="/viewhospitals">Hospitals</a>
    <a href="/mybookings">My Bookings</a>
    <a href="/">Logout</a>
  </div>
  
  <h2>Doctors at {{ hospital.hospitalname }}</h2>
  
  {% for doctor in doctors %}
  <div class="doctor-card">
    <img src="{{ doctor.image.url }}" alt="doctor">
    <div>
      <h3>{{ doctor.doctorname }}</h3>
      <p><strong>Department:</strong> {{ doctor.department }}</p>
      <p><strong>Qualification:</strong> {{ doctor.qualification }}</p>
      <p><strong>Registration:</strong> {{ doctor.registration_number }}</p>
      <a href="/bookappointment/{{ doctor.id }}" class="btn">Book Appointment</a>
    </div>
  </div>
  {% endfor %}
</div>
</body>
</html>
